<script>(function(){var V="9de3d56050",P=/\/ui\/(scene|intros|avatars)\//;
function fix(i){var s=i.getAttribute('src')||'';if(P.test(s)&&s.indexOf('v='+V)<0)i.setAttribute('src',s+(s.indexOf('?')<0?'?':'&')+'v='+V);}
new MutationObserver(function(ms){ms.forEach(function(m){if(m.type==='attributes')return fix(m.target);m.addedNodes.forEach(function(n){if(n.nodeType!==1)return;if(n.tagName==='IMG')fix(n);n.querySelectorAll&&n.querySelectorAll('img').forEach(fix);});});}).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src']});
document.addEventListener('error',function(e){var i=e.target;if(!(i instanceof HTMLImageElement))return;var s=i.getAttribute('src')||'';if(!P.test(s))return;var n=+(i.dataset.retried||0);if(n>=2)return;i.dataset.retried=n+1;setTimeout(function(){i.setAttribute('src',s.replace(/[?&]r=\d+/,'')+'&r='+Date.now());},600*(n+1));},true);})();</script></head>
